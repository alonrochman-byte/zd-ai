<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZD-AI // Menlo Security</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0f0e; --surface:#141714; --surface2:#1a1d1a; --border:#2a2e2a;
  --green:#4ade80; --green-dim:#22543d; --green-glow:rgba(74,222,128,0.12);
  --amber:#fbbf24; --amber-dim:rgba(251,191,36,0.12);
  --blue:#60a5fa; --blue-dim:rgba(96,165,250,0.1);
  --red:#f87171; --text:#e2e8e2; --text-dim:#6b7a6b; --text-muted:#3d4a3d;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:100;}

.window{width:900px;max-width:98vw;height:93vh;background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(74,222,128,0.06);overflow:hidden;animation:fadeIn 0.4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.titlebar{background:var(--surface2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.dot{width:10px;height:10px;border-radius:50%;}
.dot-r{background:#ef4444}.dot-y{background:#f59e0b}.dot-g{background:#22c55e}
.tbar-text{margin-left:6px;font-size:11px;color:var(--text-dim);letter-spacing:0.08em;}
.tbar-right{margin-left:auto;font-size:10px;color:var(--text-muted);letter-spacing:0.05em;}

/* LOGIN */
#login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}
.logo{font-size:11px;color:var(--green);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:2rem;display:flex;align-items:center;gap:8px;}
.logo::before,.logo::after{content:'';display:block;width:40px;height:1px;background:var(--green-dim);}
.form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10px;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase;}
.field input{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:9px 12px;font-family:var(--mono);font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s;}
.field input:focus{border-color:var(--green-dim);box-shadow:0 0 0 3px var(--green-glow);}
.field input[type="password"]{letter-spacing:3px;}
.field-hint{font-size:10px;color:var(--text-muted);margin-top:2px;}
.btn-primary{background:transparent;border:1px solid var(--green-dim);color:var(--green);font-family:var(--mono);font-size:12px;letter-spacing:0.15em;text-transform:uppercase;padding:11px;border-radius:4px;cursor:pointer;transition:all 0.2s;margin-top:4px;}
.btn-primary:hover:not(:disabled){background:var(--green-glow);border-color:var(--green);box-shadow:0 0 20px var(--green-glow);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.err{font-size:11px;color:var(--red);display:none;padding:8px;border:1px solid rgba(248,113,113,0.2);border-radius:4px;background:rgba(248,113,113,0.05);}

/* SETUP */
#setup{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;}

/* MAIN */
#main{flex:1;display:none;flex-direction:row;overflow:hidden;}
.panel-left{width:340px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.statsbar{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);flex-shrink:0;}
.stat{padding:8px 10px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-l{font-size:9px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:1px;}
.stat-v{font-size:16px;font-weight:600;color:var(--green);}
.stat-v.amber{color:var(--amber);}
.stat-v.dim{color:var(--text-dim);font-size:13px;}
.toolbar{border-bottom:1px solid var(--border);padding:7px 10px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.toolbar select,.toolbar input[type="text"]{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 7px;border-radius:3px;outline:none;width:100%;}
.toolbar-row{display:flex;gap:6px;}
.toolbar-row select{flex:1;}
.btn-refresh{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-family:var(--mono);font-size:10px;padding:5px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.btn-refresh:hover{border-color:var(--green-dim);color:var(--green);}
.tlist{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.tlist::-webkit-scrollbar{width:3px;}
.tlist::-webkit-scrollbar-thumb{background:var(--border);}
.trow{border-bottom:1px solid var(--border);padding:9px 12px;cursor:pointer;transition:background 0.1s;}
.trow:hover{background:var(--surface2);}
.trow.active{background:var(--green-glow);border-left:2px solid var(--green);}
.trow-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.tid{font-size:10px;color:var(--text-muted);flex-shrink:0;}
.tsubj{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.badge{font-size:9px;padding:2px 6px;border-radius:3px;text-transform:uppercase;font-weight:500;flex-shrink:0;}
.badge-new{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(251,191,36,0.2);}
.badge-open{background:var(--green-glow);color:var(--green);border:1px solid var(--green-dim);}
.badge-pending{background:rgba(148,163,184,0.1);color:#94a3b8;border:1px solid rgba(148,163,184,0.2);}
.badge-solved{background:rgba(61,74,61,0.5);color:var(--text-dim);border:1px solid var(--border);}
.badge-closed{background:rgba(61,74,61,0.3);color:var(--text-muted);border:1px solid var(--border);}
.trow-meta{font-size:10px;color:var(--text-muted);display:flex;gap:8px;}
.state-msg{padding:2rem;text-align:center;color:var(--text-muted);font-size:11px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;}
.spinner{display:inline-block;width:10px;height:10px;border:1px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.pagination{border-top:1px solid var(--border);padding:7px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.pagination span{font-size:10px;color:var(--text-muted);}
.pbtns{display:flex;gap:5px;}
.pbtn{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;transition:all 0.15s;}
.pbtn:hover:not(:disabled){border-color:var(--green-dim);color:var(--green);}
.pbtn:disabled{opacity:0.3;cursor:not-allowed;}
.panel-right{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ai-header{border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ai-title{font-size:11px;color:var(--green);letter-spacing:0.1em;text-transform:uppercase;}
.ai-subtitle{font-size:10px;color:var(--text-muted);margin-left:auto;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ai-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.ai-messages::-webkit-scrollbar{width:3px;}
.ai-messages::-webkit-scrollbar-thumb{background:var(--border);}
.msg{display:flex;flex-direction:column;gap:3px;animation:msgIn 0.2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.msg-meta{font-size:9px;color:var(--text-muted);letter-spacing:0.08em;text-transform:uppercase;display:flex;gap:6px;}
.msg-meta .who-user{color:var(--amber);}
.msg-meta .who-ai{color:var(--green);}
.msg-body{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:4px;white-space:pre-wrap;word-break:break-word;font-family:var(--sans);}
.msg.user .msg-body{border-left:2px solid var(--amber);background:var(--amber-dim);color:#fde68a;}
.msg.ai .msg-body{border-left:2px solid var(--green-dim);background:var(--green-glow);color:var(--text);}
.msg.sys .msg-body{border-left:2px solid var(--text-muted);background:transparent;color:var(--text-dim);font-size:11px;font-family:var(--mono);}
.msg.thinking .msg-body{color:var(--text-muted);font-family:var(--mono);font-size:12px;}
.cursor{display:inline-block;width:7px;height:13px;background:var(--green);margin-left:2px;vertical-align:middle;animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.suggestions{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 8px;flex-shrink:0;}
.sugg{font-family:var(--mono);font-size:11px;padding:4px 9px;background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;cursor:pointer;transition:all 0.15s;}
.sugg:hover{border-color:var(--green-dim);color:var(--green);background:var(--green-glow);}
.ai-input-area{border-top:1px solid var(--border);padding:11px 14px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;background:var(--surface2);}
.prompt-sym{font-size:14px;color:var(--green);padding-bottom:7px;flex-shrink:0;}
#ai-input{flex:1;background:transparent;border:none;outline:none;font-family:var(--sans);font-size:13px;color:var(--text);resize:none;min-height:34px;max-height:100px;line-height:1.6;padding:5px 0;}
#ai-input::placeholder{color:var(--text-muted);}
.btn-send{background:transparent;border:1px solid var(--green-dim);color:var(--green);font-family:var(--mono);font-size:11px;letter-spacing:0.1em;padding:7px 13px;border-radius:3px;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
.btn-send:hover:not(:disabled){background:var(--green-glow);border-color:var(--green);}
.btn-send:disabled{opacity:0.3;cursor:not-allowed;}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
    <span class="tbar-text">ZD-AI // MENLO SECURITY</span>
    <span class="tbar-right" id="conn-status">● OFFLINE</span>
  </div>

  <!-- LOGIN -->
  <div id="login">
    <div class="logo">Zendesk AI Assistant</div>
    <div class="form">
      <div class="field">
        <label>Team Password</label>
        <input type="password" id="team-password" placeholder="Enter team password..." onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <button class="btn-primary" id="btn-login" onclick="doLogin()">[ LOGIN ]</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>

  <!-- SETUP - Zendesk token -->
  <div id="setup">
    <div class="logo">Connect Zendesk</div>
    <div class="form">
      <div class="field">
        <label>Your Email</label>
        <input type="email" id="email" placeholder="you@menlosecurity.com"/>
      </div>
      <div class="field">
        <label>Zendesk API Token</label>
        <input type="password" id="zd-token" placeholder="Your personal Zendesk token..."/>
        <span class="field-hint">Admin → Apps & Integrations → APIs → Zendesk API</span>
      </div>
      <button class="btn-primary" id="btn-conn" onclick="doConnect()">[ CONNECT ]</button>
      <div class="err" id="setup-err"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div class="panel-left">
      <div class="statsbar">
        <div class="stat"><div class="stat-l">Open</div><div class="stat-v dim" id="s-open">—</div></div>
        <div class="stat"><div class="stat-l">Pending</div><div class="stat-v dim amber" id="s-pending">—</div></div>
        <div class="stat"><div class="stat-l">Total</div><div class="stat-v dim" id="s-total">—</div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-row">
          <select id="f-status" onchange="applyFilters()">
            <option value="">All statuses</option>
            <option value="new">New</option>
            <option value="open">Open</option>
            <option value="pending">Pending</option>
            <option value="solved">Solved</option>
            <option value="closed">Closed</option>
          </select>
          <select id="f-group" onchange="applyFilters()">
            <option value="">All groups</option>
            <option value="Support">Support</option>
            <option value="Votiro Support">Votiro Support</option>
          </select>
          <button class="btn-refresh" onclick="reload()">↻</button>
        </div>
        <input type="text" id="f-search" placeholder="Search subject..." oninput="applyFilters()"/>
      </div>
      <div id="tlist-wrap" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <div class="state-msg" id="state-loading"><span class="spinner"></span> Loading...</div>
        <div class="tlist" id="tlist" style="display:none;"></div>
        <div class="state-msg" id="state-empty" style="display:none;">No tickets found.</div>
      </div>
      <div class="pagination">
        <span id="page-info">—</span>
        <div class="pbtns">
          <button class="pbtn" id="btn-prev" onclick="prevPage()" disabled>◀</button>
          <button class="pbtn" id="btn-next" onclick="nextPage()" disabled>▶</button>
        </div>
      </div>
    </div>

    <div class="panel-right">
      <div class="ai-header">
        <span style="font-size:14px;color:var(--green);">◈</span>
        <span class="ai-title">AI Assistant</span>
        <span class="ai-subtitle" id="active-ticket-label">No ticket selected</span>
      </div>
      <div class="ai-messages" id="ai-messages"></div>
      <div class="suggestions" id="suggestions"></div>
      <div class="ai-input-area">
        <span class="prompt-sym">›</span>
        <textarea id="ai-input" placeholder="Describe the problem or ask anything about your tickets..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="btn-send" onclick="sendMsg()">SEND</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUBDOMAIN = 'menlosecurity';
let creds={}, allTickets=[], filtered=[], groupMap={}, pg=0, busy=false;
let activeTicket=null, chatHistory=[];
const PS=30;

function showErr(id,m){const e=document.getElementById(id);e.textContent=m;e.style.display='block';}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}

async function doLogin(){
  const pw=document.getElementById('team-password').value;
  if(!pw){showErr('login-err','Enter password.');return;}
  document.getElementById('btn-login').disabled=true;
  document.getElementById('login-err').style.display='none';
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(d.ok){
      document.getElementById('login').style.display='none';
      document.getElementById('setup').style.display='flex';
    } else {
      showErr('login-err','Wrong password.');
      document.getElementById('btn-login').disabled=false;
    }
  }catch(e){showErr('login-err','Error: '+e.message);document.getElementById('btn-login').disabled=false;}
}

async function zdFetch(path){
  const {email,zdToken}=creds;
  const auth=btoa(unescape(encodeURIComponent(email+'/token:'+zdToken)));
  const [p,q]=path.split('?');
  let url='/api/zd?path='+encodeURIComponent(p);
  if(q){q.split('&').forEach(kv=>{const[k,v]=kv.split('=');url+='&'+k+'='+decodeURIComponent(v||'');});}
  const r=await fetch(url,{headers:{'X-ZD-Auth':auth,'X-ZD-Subdomain':SUBDOMAIN}});
  if(!r.ok){const b=await r.text();throw new Error('ZD '+r.status+': '+b.slice(0,80));}
  return r.json();
}

async function claudeFetch(messages,system){
  const r=await fetch('/api/claude',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,system,messages})
  });
  if(!r.ok){const b=await r.text();throw new Error('Claude '+r.status+': '+b.slice(0,80));}
  return r.json();
}

async function doConnect(){
  const email=document.getElementById('email').value.trim();
  const zdToken=document.getElementById('zd-token').value.trim();
  if(!email||!zdToken){showErr('setup-err','All fields required.');return;}
  creds={email,zdToken};
  document.getElementById('btn-conn').disabled=true;
  document.getElementById('setup-err').style.display='none';
  try{await zdFetch('users/me.json');}
  catch(e){showErr('setup-err','Connection failed: '+e.message);document.getElementById('btn-conn').disabled=false;return;}
  document.getElementById('setup').style.display='none';
  document.getElementById('main').style.display='flex';
  document.getElementById('conn-status').textContent='● ONLINE';
  document.getElementById('conn-status').style.color='#4ade80';
  addMsg('sys','Connected as '+email+'. Select a ticket or ask me anything.');
  showSuggestions();
  loadStats();
  reload();
}

async function loadStats(){
  try{const g=await zdFetch('groups.json');g.groups.forEach(x=>{groupMap[x.id]=x.name;});}catch(e){}
  for(const st of['open','pending']){
    try{const d=await zdFetch('search.json?query=type:ticket+status:'+st+'&per_page=1');
      const el=document.getElementById('s-'+st);if(el){el.textContent=d.count||0;el.classList.remove('dim');}
    }catch(e){}
  }
  try{const d=await zdFetch('search.json?query=type:ticket+status<closed&per_page=1');
    const el=document.getElementById('s-total');if(el){el.textContent=d.count||0;el.classList.remove('dim');}
  }catch(e){}
}

async function reload(){
  document.getElementById('state-loading').style.display='flex';
  document.getElementById('tlist').style.display='none';
  document.getElementById('state-empty').style.display='none';
  allTickets=[];
  let next='search.json?query=type:ticket+status<closed&per_page=100&sort_by=updated_at&sort_order=desc';
  let fetched=0;
  try{
    while(next&&fetched<600){
      const d=await zdFetch(next);
      const res=d.results||[];
      res.forEach(t=>{if(groupMap[t.group_id])t._grp=groupMap[t.group_id];});
      allTickets=allTickets.concat(res);fetched+=res.length;
      next=d.next_page?'search.json?'+(d.next_page.split('?')[1]):null;
    }
  }catch(e){
    document.getElementById('state-loading').style.display='none';
    document.getElementById('state-empty').textContent='Error: '+e.message;
    document.getElementById('state-empty').style.display='flex';return;
  }
  pg=0;applyFilters();
}

function applyFilters(){
  const st=document.getElementById('f-status').value;
  const gr=document.getElementById('f-group').value;
  const sr=document.getElementById('f-search').value.toLowerCase();
  filtered=allTickets.filter(t=>{
    if(st&&t.status!==st)return false;
    if(gr&&t._grp!==gr)return false;
    if(sr&&!(t.subject||'').toLowerCase().includes(sr))return false;
    return true;
  });
  pg=0;renderPage();
}

function renderPage(){
  const list=document.getElementById('tlist');
  document.getElementById('state-loading').style.display='none';
  if(filtered.length===0){
    list.style.display='none';
    const e=document.getElementById('state-empty');e.style.display='flex';
    e.textContent=allTickets.length===0?'No tickets found.':'No matches.';
    document.getElementById('page-info').textContent='0';
    document.getElementById('btn-prev').disabled=true;document.getElementById('btn-next').disabled=true;return;
  }
  document.getElementById('state-empty').style.display='none';list.style.display='block';
  const s=pg*PS,e=Math.min(s+PS,filtered.length);
  list.innerHTML=filtered.slice(s,e).map(t=>{
    const d=t.updated_at?new Date(t.updated_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';
    const isActive=activeTicket&&activeTicket.id===t.id;
    return`<div class="trow${isActive?' active':''}" onclick="selectTicket(${t.id})">
      <div class="trow-top"><span class="tid">#${t.id}</span>
        <span class="tsubj" title="${h(t.subject||'')}">${h(t.subject||'(no subject)')}</span>
        <span class="badge badge-${t.status}">${t.status}</span></div>
      <div class="trow-meta"><span>${t._grp||''}</span><span>${d}</span></div>
    </div>`;
  }).join('');
  document.getElementById('page-info').textContent=`${s+1}–${e} / ${filtered.length}`;
  document.getElementById('btn-prev').disabled=pg===0;
  document.getElementById('btn-next').disabled=e>=filtered.length;
}

function prevPage(){if(pg>0){pg--;renderPage();}}
function nextPage(){if((pg+1)*PS<filtered.length){pg++;renderPage();}}

async function selectTicket(id){
  const t=allTickets.find(x=>x.id===id);
  if(!t)return;
  activeTicket=t;renderPage();
  document.getElementById('active-ticket-label').textContent='#'+t.id+' — '+(t.subject||'').slice(0,40);
  addMsg('sys','Loading ticket #'+t.id+'...');
  try{
    const data=await zdFetch('tickets/'+t.id+'/comments.json');
    const comments=(data.comments||[]).slice(0,8).map(c=>`[${new Date(c.created_at).toLocaleDateString('en-GB')}] ${(c.body||'').slice(0,600)}`).join('\n\n');
    activeTicket._comments=comments;
    const lastSys=[...document.getElementById('ai-messages').querySelectorAll('.msg.sys')].pop();
    if(lastSys)lastSys.remove();
    chatHistory=[];
    addMsg('sys','Analyzing ticket #'+t.id+'...');
    await autoAnalyze(t,comments);
  }catch(e){addMsg('sys','Could not load ticket: '+e.message);}
}

async function autoAnalyze(t,comments){
  const prompt=`I just opened ticket #${t.id}: "${t.subject}"\n\nConversation:\n${comments}\n\nPlease:\n1. Summarize the problem in 2-3 sentences\n2. Identify similar past tickets from our history\n3. Suggest likely causes and next troubleshooting steps`;
  chatHistory.push({role:'user',content:prompt});
  const thinkEl=addMsg('thinking','Analyzing...');
  try{
    const data=await claudeFetch(chatHistory,buildSystem());
    const answer=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    thinkEl.remove();addMsg('ai',answer);
    chatHistory.push({role:'assistant',content:answer});
    showSuggestions(true);
  }catch(e){thinkEl.remove();addMsg('sys','AI error: '+e.message);}
}

function buildSystem(){
  const recentSolved=allTickets.filter(t=>t.status==='solved'||t.status==='closed').slice(0,80)
    .map(t=>`#${t.id}: ${t.subject} [${t._grp||''}]`).join('\n');
  return`You are a senior support engineer at Menlo Security / Votiro. Help analyze Zendesk tickets and find solutions.\n\nRecent solved tickets:\n${recentSolved}\n\nGuidelines:\n- Be concise and practical\n- Reference past ticket numbers when relevant\n- Answer in the same language the user writes in (Hebrew or English)`;
}

async function sendMsg(){
  if(busy)return;
  const input=document.getElementById('ai-input');
  const q=input.value.trim();if(!q)return;
  input.value='';input.style.height='auto';
  document.getElementById('suggestions').innerHTML='';
  document.getElementById('btn-send').disabled=true;busy=true;
  addMsg('user',q);chatHistory.push({role:'user',content:q});
  const thinkEl=addMsg('thinking','Thinking...');
  try{
    const data=await claudeFetch(chatHistory,buildSystem());
    const answer=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    thinkEl.remove();addMsg('ai',answer);
    chatHistory.push({role:'assistant',content:answer});
    if(chatHistory.length>30)chatHistory=chatHistory.slice(-30);
    showSuggestions(!!activeTicket);
  }catch(e){thinkEl.remove();addMsg('sys','Error: '+e.message);}
  busy=false;
  document.getElementById('btn-send').disabled=false;
  document.getElementById('ai-input').focus();
}

function showSuggestions(hasTicket){
  const qs=hasTicket?['Find similar past tickets','What was the solution in similar cases?','Draft a response to the customer','What info should I ask for next?']:['How many open tickets?','Show oldest pending tickets','Any unassigned tickets?','Summarize today\'s new tickets'];
  document.getElementById('suggestions').innerHTML=qs.map(q=>`<button class="sugg" onclick="quickAsk('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('');
}

function quickAsk(q){document.getElementById('ai-input').value=q;sendMsg();}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

function addMsg(role,text){
  const now=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const whoClass=role==='user'?'who-user':role==='ai'?'who-ai':'who-sys';
  const whoLabel=role==='user'?'you':role==='ai'?'ZD-AI':role==='thinking'?'thinking':'system';
  const div=document.createElement('div');
  div.className='msg '+(role==='thinking'?'thinking':role);
  div.innerHTML=`<div class="msg-meta"><span class="${whoClass}">${whoLabel}</span><span>${now}</span></div>
<div class="msg-body">${role==='thinking'?text+'<span class="cursor"></span>':escHtml(text)}</div>`;
  const msgs=document.getElementById('ai-messages');
  msgs.appendChild(div);div.scrollIntoView({behavior:'smooth',block:'end'});
  return div;
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
